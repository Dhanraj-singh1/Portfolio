<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heroGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for 3D isometric planes -->
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cardBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Orbs -->
  <circle cx="350" cy="280" r="240" fill="url(#heroGlow1)" />
  <circle cx="200" cy="380" r="180" fill="url(#heroGlow2)" />
  <circle cx="500" cy="200" r="170" fill="url(#heroGlow3)" />

  <!-- Isometric Ground Grid -->
  <g opacity="0.35" transform="translate(350, 420) scale(1, 0.5) rotate(45)">
    <rect x="-240" y="-240" width="480" height="480" fill="none" stroke="url(#cardBorderGrad)" stroke-width="1.5" stroke-dasharray="8 6"/>
    <line x1="-240" y1="-160" x2="240" y2="-160" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="-240" y1="-80" x2="240" y2="-80" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#38bdf8" stroke-opacity="0.4"/>
    <line x1="-240" y1="80" x2="240" y2="80" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="-240" y1="160" x2="240" y2="160" stroke="#38bdf8" stroke-opacity="0.3"/>
    
    <line x1="-160" y1="-240" x2="-160" y2="240" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="-80" y1="-240" x2="-80" y2="240" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#38bdf8" stroke-opacity="0.4"/>
    <line x1="80" y1="-240" x2="80" y2="240" stroke="#38bdf8" stroke-opacity="0.3"/>
    <line x1="160" y1="-240" x2="160" y2="240" stroke="#38bdf8" stroke-opacity="0.3"/>
  </g>

  <!-- Connecting Data Stream Pipelines -->
  <path d="M 160 380 Q 250 430 350 370 T 540 320" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" opacity="0.6"/>
  <path d="M 180 200 C 260 160, 400 240, 520 180" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>
  <path d="M 350 120 L 350 480" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.4"/>

  <!-- Main Central Code/Terminal Isometric Plate -->
  <g transform="translate(180, 150)">
    <!-- Main Glass Window -->
    <rect x="0" y="0" width="340" height="230" rx="16" fill="url(#cardGrad1)" stroke="url(#cardBorderGrad)" stroke-width="1.5"/>
    
    <!-- Window Header -->
    <rect x="0" y="0" width="340" height="38" rx="16" fill="#1e293b" fill-opacity="0.8"/>
    <path d="M 0 24 L 0 38 L 340 38 L 340 24 Z" fill="#1e293b" fill-opacity="0.8"/>
    <line x1="0" y1="38" x2="340" y2="38" stroke="#334155" stroke-width="1"/>
    
    <!-- Window Buttons -->
    <circle cx="22" cy="19" r="5.5" fill="#f43f5e"/>
    <circle cx="38" cy="19" r="5.5" fill="#eab308"/>
    <circle cx="54" cy="19" r="5.5" fill="#10b981"/>
    <text x="75" y="23" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500">engineer@dhanraj:~/architecture</text>

    <!-- Code Lines / Visual representation -->
    <g transform="translate(24, 60)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11">
      <text x="0" y="0" fill="#f43f5e">const</text>
      <text x="45" y="0" fill="#38bdf8">engineer</text>
      <text x="110" y="0" fill="#94a3b8">=</text>
      <text x="125" y="0" fill="#fbbf24">{</text>
      
      <text x="16" y="22" fill="#94a3b8">name:</text>
      <text x="65" y="22" fill="#34d399">'Dhanraj Singh'</text>
      <text x="180" y="22" fill="#94a3b8">,</text>

      <text x="16" y="44" fill="#94a3b8">role:</text>
      <text x="65" y="44" fill="#34d399">'Software Engineer'</text>
      <text x="215" y="44" fill="#94a3b8">,</text>

      <text x="16" y="66" fill="#94a3b8">focus:</text>
      <text x="70" y="66" fill="#c084fc">['Scalable APIs', 'Distributed Systems']</text>
      <text x="260" y="66" fill="#94a3b8">,</text>

      <text x="16" y="88" fill="#94a3b8">status:</text>
      <text x="75" y="88" fill="#38bdf8">'Engineering High-Performance Code'</text>

      <text x="0" y="110" fill="#fbbf24">}</text>
      <text x="8" y="110" fill="#94a3b8">;</text>

      <!-- Terminal Output line -->
      <line x1="0" y1="126" x2="290" y2="126" stroke="#334155" stroke-dasharray="4 4"/>
      <text x="0" y="145" fill="#34d399">➜</text>
      <text x="18" y="145" fill="#94a3b8">build --production</text>
      <text x="170" y="145" fill="#38bdf8">[✓ 100% Optimized]</text>
    </g>
  </g>

  <!-- 3D Isometric Floating Block 1 (Database / Cache Node) -->
  <g transform="translate(100, 290)">
    <!-- Shadow -->
    <ellipse cx="40" cy="90" rx="35" ry="14" fill="#000000" opacity="0.4"/>
    <!-- Cylinder 1 -->
    <path d="M 10 30 C 10 18, 70 18, 70 30 L 70 50 C 70 62, 10 62, 10 50 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="40" cy="30" rx="30" ry="12" fill="#0284c7" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 10 50 C 10 62, 70 62, 70 50 L 70 70 C 70 82, 10 82, 10 70 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <ellipse cx="40" cy="50" rx="30" ry="12" fill="#0369a1" fill-opacity="0.6"/>
    <!-- Glowing Status Ring -->
    <circle cx="40" cy="30" r="4" fill="#38bdf8" filter="url(#neonGlow)"/>
    <text x="40" y="85" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">DATA_STORE</text>
  </g>

  <!-- 3D Floating Block 2: Microservice Engine Cube (Right) -->
  <g transform="translate(520, 240)">
    <ellipse cx="40" cy="90" rx="36" ry="14" fill="#000000" opacity="0.4"/>
    <!-- Top Face -->
    <polygon points="40,10 80,30 40,50 0,30" fill="url(#cubeTop)" stroke="#a855f7" stroke-width="1.2"/>
    <!-- Left Face -->
    <polygon points="0,30 40,50 40,90 0,70" fill="url(#cubeLeft)" stroke="#a855f7" stroke-width="1.2"/>
    <!-- Right Face -->
    <polygon points="40,50 80,30 80,70 40,90" fill="url(#cubeRight)" stroke="#a855f7" stroke-width="1.2"/>
    <!-- Center light core -->
    <circle cx="40" cy="30" r="6" fill="#c084fc" filter="url(#neonGlow)"/>
    <text x="40" y="105" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">MICROSERVICE</text>
  </g>

  <!-- Floating Badge: Performance / Uptime (Top Right) -->
  <g transform="translate(480, 80)">
    <rect x="0" y="0" width="160" height="54" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#34d399" stroke-width="1.5" filter="url(#neonGlow)"/>
    <circle cx="24" cy="27" r="8" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="24" cy="27" r="4" fill="#10b981"/>
    <text x="42" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">99.99% UPTIME</text>
    <text x="42" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Resilient Architecture</text>
  </g>

  <!-- Floating Badge: Clean Code / Git commit (Bottom Left) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="155" height="52" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Git icon inside -->
    <g transform="translate(18, 16)" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round">
      <circle cx="4" cy="10" r="3" fill="#818cf8"/>
      <circle cx="16" cy="4" r="3" fill="#818cf8"/>
      <circle cx="16" cy="16" r="3" fill="#818cf8"/>
      <line x1="4" y1="10" x2="13" y2="5"/>
      <line x1="4" y1="10" x2="13" y2="15"/>
    </g>
    <text x="44" y="23" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CLEAN CODE</text>
    <text x="44" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">CI/CD &amp; Automated Tests</text>
  </g>

  <!-- Floating Badge: Low Latency / Speed (Bottom Right) -->
  <g transform="translate(470, 420)">
    <rect x="0" y="0" width="170" height="54" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1.5"/>
    <!-- Bolt icon -->
    <path d="M 24 16 L 16 28 L 22 28 L 18 38 L 28 26 L 22 26 Z" fill="#fb7185"/>
    <text x="38" y="24" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">&lt; 15ms LATENCY</text>
    <text x="38" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">High Throughput Systems</text>
  </g>

  <!-- Decorative Orbit Particles and Sparkles -->
  <g fill="#38bdf8">
    <circle cx="340" cy="90" r="2.5" opacity="0.8"/>
    <circle cx="560" cy="160" r="1.5" opacity="0.6"/>
    <circle cx="140" cy="240" r="2" opacity="0.7"/>
    <circle cx="210" cy="470" r="2.5" opacity="0.6"/>
    <circle cx="430" cy="510" r="2" opacity="0.5"/>
    <circle cx="620" cy="380" r="3" opacity="0.8"/>
  </g>
  <g fill="#ec4899">
    <circle cx="170" cy="120" r="2" opacity="0.8"/>
    <circle cx="460" cy="220" r="2.5" opacity="0.7"/>
    <circle cx="590" cy="290" r="1.8" opacity="0.6"/>
    <circle cx="280" cy="450" r="2" opacity="0.7"/>
  </g>
</svg>

