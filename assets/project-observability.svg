<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradObs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chartLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bgGradObs)"/>

  <!-- Top Metric Cards -->
  <g transform="translate(30, 24)">
    <!-- Metric 1 -->
    <rect width="160" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="16" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">REQ / SECOND</text>
    <text x="16" y="52" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">48,290</text>
    <path d="M 120 48 L 135 32 L 145 38 L 155 24" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Metric 2 -->
    <rect x="185" width="160" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="201" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">AVG LATENCY (P99)</text>
    <text x="201" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">8.4 ms</text>
    <path d="M 305 30 L 320 42 L 330 36 L 340 48" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Metric 3 -->
    <rect x="370" width="170" height="70" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="386" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">ERROR RATE</text>
    <text x="386" y="52" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">0.001%</text>
    <circle cx="510" cy="45" r="8" fill="#10b981" fill-opacity="0.2"/>
    <circle cx="510" cy="45" r="4" fill="#10b981"/>
  </g>

  <!-- Main Chart Canvas -->
  <g transform="translate(30, 115)">
    <rect width="540" height="215" rx="12" fill="#0f172a" stroke="#1e293b"/>
    
    <!-- Chart Grid Lines -->
    <line x1="40" y1="40" x2="510" y2="40" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="40" y1="85" x2="510" y2="85" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="40" y1="130" x2="510" y2="130" stroke="#334155" stroke-dasharray="3 3"/>
    <line x1="40" y1="175" x2="510" y2="175" stroke="#334155"/>

    <!-- Y-axis labels -->
    <text x="30" y="44" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">100k</text>
    <text x="30" y="89" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">50k</text>
    <text x="30" y="134" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">25k</text>
    <text x="30" y="178" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">0</text>

    <!-- Chart Fill Area -->
    <path d="M 40 160 Q 90 140 140 150 T 240 90 T 340 70 T 440 100 T 510 50 L 510 175 L 40 175 Z" fill="url(#areaGrad)"/>

    <!-- Primary Chart Line -->
    <path d="M 40 160 Q 90 140 140 150 T 240 90 T 340 70 T 440 100 T 510 50" fill="none" stroke="url(#chartLineGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Secondary Line (e.g. baseline) -->
    <path d="M 40 140 Q 90 120 140 135 T 240 130 T 340 120 T 440 110 T 510 100" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.7"/>

    <!-- Active Point Highlight -->
    <circle cx="340" cy="70" r="6" fill="#10b981"/>
    <circle cx="340" cy="70" r="12" fill="#10b981" fill-opacity="0.25"/>

    <!-- Tooltip -->
    <g transform="translate(290, 20)">
      <rect width="100" height="36" rx="6" fill="#1e293b" stroke="#34d399"/>
      <text x="50" y="16" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="9">PEAK TRAFFIC</text>
      <text x="50" y="28" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">89.4k rps</text>
    </g>

    <!-- X-axis timestamps -->
    <text x="50" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">10:00</text>
    <text x="140" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">10:15</text>
    <text x="240" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">10:30</text>
    <text x="340" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">10:45</text>
    <text x="440" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">11:00</text>
    <text x="500" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">LIVE</text>
  </g>
</svg>

