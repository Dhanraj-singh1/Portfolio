<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradDist" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="distGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#bgGradDist)"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Pipeline Pathways -->
  <path d="M 80 180 C 180 180, 180 100, 280 100 S 380 200, 480 200" stroke="url(#streamGrad1)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 80 180 C 180 180, 180 260, 280 260 S 380 140, 480 140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Cluster Node 1: Producer -->
  <g transform="translate(60, 140)">
    <rect width="80" height="80" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="40" cy="30" r="14" fill="#0284c7" fill-opacity="0.3"/>
    <path d="M 33 30 L 47 30 M 40 23 L 40 37" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="60" text-anchor="middle" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PRODUCER</text>
  </g>

  <!-- Cluster Node 2: Kafka / Stream Broker (Center) -->
  <g transform="translate(240, 60)">
    <rect width="120" height="80" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="2" filter="url(#distGlow)"/>
    <rect x="15" y="15" width="90" height="18" rx="4" fill="#312e81"/>
    <text x="60" y="28" text-anchor="middle" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PARTITION-0</text>
    <rect x="15" y="42" width="90" height="18" rx="4" fill="#312e81"/>
    <text x="60" y="55" text-anchor="middle" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PARTITION-1</text>
  </g>

  <!-- Cluster Node 3: Worker Node Pool (Center Bottom) -->
  <g transform="translate(240, 220)">
    <rect width="120" height="80" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="60" y="32" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">WORKER POOL</text>
    <circle cx="35" cy="54" r="6" fill="#10b981"/>
    <circle cx="60" cy="54" r="6" fill="#10b981"/>
    <circle cx="85" cy="54" r="6" fill="#10b981"/>
  </g>

  <!-- Cluster Node 4: Consumer / DB Sink (Right) -->
  <g transform="translate(450, 130)">
    <rect width="100" height="96" rx="12" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <!-- DB Cylinder icon -->
    <ellipse cx="50" cy="30" rx="28" ry="10" fill="#be185d" stroke="#f472b6" stroke-width="1.5"/>
    <path d="M 22 30 L 22 50 C 22 60 78 60 78 50 L 78 30" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <path d="M 22 50 L 22 70 C 22 80 78 80 78 70 L 78 50" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <text x="50" y="86" text-anchor="middle" fill="#fbcfe8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">DATA LAKE</text>
  </g>

  <!-- Animated-style packet dots -->
  <circle cx="180" cy="140" r="5" fill="#38bdf8" filter="url(#distGlow)"/>
  <circle cx="210" cy="115" r="4" fill="#818cf8"/>
  <circle cx="410" cy="170" r="5" fill="#f43f5e" filter="url(#distGlow)"/>
  <circle cx="440" cy="200" r="4" fill="#38bdf8"/>

  <!-- Metric overlay badge -->
  <g transform="translate(20, 20)">
    <rect width="150" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155"/>
    <text x="12" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">⚡ 1.2M events/sec</text>
  </g>
</svg>

