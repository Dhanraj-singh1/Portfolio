<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="200" cy="200" r="170" fill="url(#avatarGlow)"/>

  <!-- Rotating aesthetic outer ring with dash lines -->
  <circle cx="200" cy="200" r="160" stroke="url(#ringGrad1)" stroke-width="2.5" stroke-dasharray="14 8 2 8" opacity="0.85"/>
  <circle cx="200" cy="200" r="142" stroke="url(#ringGrad2)" stroke-width="1.5" stroke-dasharray="30 15 5 15" opacity="0.6"/>

  <!-- Decorative technical ticks around border -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="26" x2="200" y2="34"/>
    <line x1="200" y1="366" x2="200" y2="374"/>
    <line x1="26" y1="200" x2="34" y2="200"/>
    <line x1="366" y1="200" x2="374" y2="200"/>
    <line x1="77" y1="77" x2="83" y2="83"/>
    <line x1="323" y1="323" x2="317" y2="317"/>
    <line x1="77" y1="323" x2="83" y2="317"/>
    <line x1="323" y1="77" x2="317" y2="83"/>
  </g>

  <!-- Inner circular container -->
  <circle cx="200" cy="200" r="128" fill="url(#avatarBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2"/>

  <!-- Subtle grid pattern inside avatar -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="120" y1="120" x2="280" y2="120"/>
    <line x1="100" y1="160" x2="300" y2="160"/>
    <line x1="90" y1="200" x2="310" y2="200"/>
    <line x1="100" y1="240" x2="300" y2="240"/>
    <line x1="120" y1="280" x2="280" y2="280"/>
    <line x1="160" y1="100" x2="160" y2="300"/>
    <line x1="200" y1="90" x2="200" y2="310"/>
    <line x1="240" y1="100" x2="240" y2="300"/>
  </g>

  <!-- Stylized Software Engineer Silhouette with Tech Accents -->
  <g clip-path="url(#circleClip)">
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="126"/>
    </clipPath>

    <!-- Torso / Hoodie -->
    <path d="M 120 320 C 120 260 145 235 200 235 C 255 235 280 260 280 320 Z" fill="#1e293b"/>
    <!-- Collar & Zip details -->
    <path d="M 180 240 L 200 270 L 220 240" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="270" x2="200" y2="320" stroke="#38bdf8" stroke-width="2"/>

    <!-- Neck -->
    <rect x="185" y="195" width="30" height="30" rx="6" fill="#334155"/>

    <!-- Head / Jawline -->
    <path d="M 160 160 C 160 120 175 110 200 110 C 225 110 240 120 240 160 C 240 195 225 215 200 215 C 175 215 160 195 160 160 Z" fill="#475569"/>

    <!-- Modern Hair Silhouette -->
    <path d="M 156 150 C 152 125 170 95 200 95 C 230 95 248 115 244 145 C 235 135 220 130 205 130 C 185 130 170 140 156 150 Z" fill="#0f172a"/>

    <!-- Stylish Modern Tech Glasses with glowing cyan/neon lenses -->
    <g>
      <!-- Frame -->
      <rect x="165" y="152" width="28" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <rect x="207" y="152" width="28" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <line x1="193" y1="158" x2="207" y2="158" stroke="#38bdf8" stroke-width="2"/>
      <!-- Lens Reflections / Code Reflection -->
      <line x1="168" y1="157" x2="188" y2="157" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="168" y1="162" x2="180" y2="162" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="210" y1="157" x2="230" y2="157" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="210" y1="162" x2="224" y2="162" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Headphones Band & Earcups (Classic Engineer Look) -->
    <path d="M 152 165 C 150 115 170 90 200 90 C 230 90 250 115 248 165" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <rect x="146" y="150" width="10" height="26" rx="5" fill="#38bdf8"/>
    <rect x="244" y="150" width="10" height="26" rx="5" fill="#38bdf8"/>
  </g>

  <!-- Floating Monogram Badge (Bottom Right) -->
  <g transform="translate(265, 265)">
    <circle cx="28" cy="28" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#softGlow)"/>
    <text x="28" y="34" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="800">&lt;DS/&gt;</text>
  </g>

  <!-- Glowing Data Points -->
  <circle cx="65" cy="170" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
  <circle cx="330" cy="130" r="4.5" fill="#ec4899" filter="url(#softGlow)"/>
  <circle cx="100" cy="300" r="3.5" fill="#34d399" filter="url(#softGlow)"/>
</svg>

